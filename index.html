<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Կրթական Հարթակ - Մուտք</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #5a6fd6; }
        .error { color: #e74c3c; font-size: 14px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Մուտք Համակարգ</h2>
    <input type="text" id="username" placeholder="Օգտանուն">
    <input type="password" id="password" placeholder="Գաղտնաբառ">
    <button onclick="handleLogin()">Մուտք գործել</button>
    <div id="error-msg" class="error">Սխալ օգտանուն կամ գաղտնաբառ</div>
</div>

<script>
    const TEACHER_USER = "teacher2024";
    const TEACHER_PASS_ENCODED = "ZHByb2MxMjM="; 
    const STUDENT_PASS_ENCODED = "MTIzNDU=";    

    // Աշակերտների տվյալները խմբավորված ըստ դասարանների
    const studentsData = {
        '11ա': ['Աբգարյան Տաթևիկ', 'Աղեկյան Մանվել', 'Արամյան Արսեն', 'Արզումանյան Անժելա', 'Բաբայան Արյուսակ', 'Բաղդասարյան Արյուսակ', 'Բունիաթյան Գոհար', 'Գասպարյան Արսեն', 'Գյուլումյան Հասմիկ', 'Գրիգորյան Աննա', 'Զաքարյան Աշխեն', 'Խալաթյան Աշխեն', 'Կարապետյան Ալիսա', 'Հովհաննիսյան Մելինե', 'Մեսրոպյան Սոնա', 'Մուրադյան Արսեն', 'Ներսիսյան Մարինա', 'Նիկողոսյան Մարգարիտ', 'Շահբազյան Լիլիա', 'Սուքիսյան Նարինե'],
        '12ա': ['Աբելյան Զարուհի', 'Աբրահամյան Լիլիա', 'Գյուլումյան Վահե', 'Դավթյան Կարեն', 'Դիլանյան Աննա', 'Զալյան Արման', 'Թադևոսյան Սյուզան', 'Իգիթյան Սոնա', 'Լևոնյան Արթեմ', 'Կարապետյան Լիլիթ', 'Կիրակոսյան Ռոզա', 'Կիրակոսյան Ալիսա', 'Հակոբջանյան Անի', 'Մամիկոնյան Ռուբեն', 'Նահապետյան Գայանե', 'Սահակյան Կարեն', 'Վանյան Արյուսակ', 'Փայտյան Հրայր', 'Քյարունյան Կարեն', 'Օհաննիսյան Հակոբ'],
        '10դ': ['Ասատրյան Հակոբ', 'Բաբաջանյան Դավիթ', 'Բարսեղյան Անահիտ', 'Գարսոյան Լիլիթ', 'Գոգյան Գարիկ', 'Մարաբյան Արսեն', 'Մինասյան Ալլա', 'Մինասյան Մինաս', 'Պոտրոսյան Գաբրիել', 'Քեշիշյան Մարի']
    };

    // Ճշգրիտ Տառադարձման ֆունկցիա (Translit)
    function transliterate(text) {
        if (!text) return "";
        
        let processed = text.toLowerCase().trim();
        
        // Նախ փոխարինում ենք բարդ հնչյուններն ու երկհնչյունները
        processed = processed.replace(/ու/g, 'u');
        processed = processed.replace(/եվ/g, 'ev');
        processed = processed.replace(/և/g, 'ev');
        processed = processed.replace(/չ/g, 'ch');
        processed = processed.replace(/ճ/g, 'ch');
        processed = processed.replace(/ջ/g, 'j');
        processed = processed.replace(/ժ/g, 'zh');
        processed = processed.replace(/խ/g, 'kh');
        processed = processed.replace(/ծ/g, 'ts');
        processed = processed.replace(/ձ/g, 'dz');
        processed = processed.replace(/ղ/g, 'gh');
        processed = processed.replace(/ց/g, 'ts');
        processed = processed.replace(/շ/g, 'sh');

        const armToLat = {
            'ա': 'a', 'բ': 'b', 'գ': 'g', 'դ': 'd', 'ե': 'e', 'զ': 'z', 'է': 'e', 'ը': 'e',
            'թ': 't', 'ի': 'i', 'լ': 'l', 'կ': 'k', 'հ': 'h', 'մ': 'm', 'յ': 'y', 'ն': 'n', 
            'ո': 'o', 'պ': 'p', 'ռ': 'r', 'ս': 's', 'վ': 'v', 'տ': 't', 'ր': 'r', 'փ': 'p', 
            'ք': 'q', 'օ': 'o', 'ֆ': 'f'
        };
        
        return processed.split('').map(char => armToLat[char] || char).join('');
    }

    // Դասարանի անունը մաքրող և լատինատառ դարձնող ֆունկցիա
    function cleanClassName(className) {
        const classLetters = { 'ա': 'a', 'բ': 'b', 'գ': 'g', 'դ': 'd', 'ե': 'e' };
        let num = className.match(/\d+/)[0]; 
        let letPart = className.replace(num, '').trim().toLowerCase(); 
        let safeLetter = classLetters[letPart] || letPart;
        return num + safeLetter;
    }

    function handleLogin() {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        const error = document.getElementById('error-msg');

        error.style.display = 'none';

        sessionStorage.removeItem('isLoggedIn');
        localStorage.removeItem('isLoggedIn');

        const encodedPass = btoa(pass);

        // 1. Ուսուցչի մուտք
        if (user === TEACHER_USER.toLowerCase() && encodedPass === TEACHER_PASS_ENCODED) {
            sessionStorage.setItem('isLoggedIn', 'teacher');
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = "matyan.html";
            return;
        }

        // 2. Աշակերտների մուտքի ստուգում
        let studentFound = false;

        for (let className in studentsData) {
            const classStudents = studentsData[className];
            const safeClassName = cleanClassName(className); 

            for (let i = 0; i < classStudents.length; i++) {
                const fullName = classStudents[i];
                const parts = fullName.split(' ');
                const lastName = parts[0];
                const firstName = parts[1] || "";

                // Լատինատառ դարձնել
                const latLastName = transliterate(lastName);
                const latFirstName = transliterate(firstName);

                // Գեներացնում ենք օգտանունը՝ ազգանուն_անուն_դասարան ֆորմատով
                const generatedUsername = `${latLastName}_${latFirstName}_${safeClassName}`;

                if (user === generatedUsername && encodedPass === STUDENT_PASS_ENCODED) {
                    studentFound = true;
                    sessionStorage.setItem('isLoggedIn', 'student');
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Տվյալների պահպանում աշակերտի էջի համար
                    localStorage.setItem('studentName', fullName); 
                    localStorage.setItem('studentClass', className); 
                    
                    window.location.href = "student_view.html";
                    break;
                }
            }
            if (studentFound) break;
        }

        if (!studentFound) {
            error.style.display = 'block';
        }
    }
</script>

</body>
</html>
