<!DOCTYPE html>
<html lang="hy">
<head>
    <script>
        // Ստուգում ենք մուտքը նախքան էջի բեռնվելը
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսուցչի Մատյան - Սինխրոնացված</title>
    <style>
    :root { 
        --primary: #4a90e2; 
        --bg: #f0f4f8; 
        --text: #2c3e50; 
        --success: #2ecc71; 
        --border: #dee2e6; 
        --annual-color: #9b59b6; 
    }

    body { 
        font-family: 'Sylfaen', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: var(--bg); 
        margin: 0; 
        padding: 10px; 
        color: var(--text); 
    }

    .container { 
        max-width: 100%; 
        margin: auto; 
        background: white; 
        padding: 15px; 
        border-radius: 15px; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
    }

    .header-section { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }

    h2 { font-size: 18px; color: var(--primary); margin: 0; }
    h3 { font-size: 16px; color: var(--text); margin-top: 0; }

    .selector-box { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 12px; 
        margin-bottom: 20px; 
    }

    .btn-group { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 8px; 
    }

    .btn { 
        padding: 8px 16px; 
        font-size: 13px; 
        cursor: pointer; 
        border: 2px solid var(--primary); 
        border-radius: 10px; 
        background: white; 
        color: var(--primary); 
        font-weight: bold; 
        transition: 0.2s;
    }

    .btn.active { background: var(--primary); color: white; }

    .table-wrapper { 
        overflow-x: auto; 
        border-radius: 12px; 
        border: 1px solid var(--border); 
        position: relative;
        -webkit-overflow-scrolling: touch; 
    }

    table { 
        width: 100%; 
        min-width: 900px; 
        border-collapse: collapse; 
        background: white;
    }

    th { 
        background: #f8f9fa; 
        padding: 12px 5px; 
        font-size: 10px; 
        border-bottom: 2px solid var(--border); 
        color: #7f8c8d;
        text-transform: uppercase;
    }

    td { 
        padding: 8px 5px; 
        border-bottom: 1px solid #f1f1f1; 
        text-align: center; 
    }

    .student-name { 
        text-align: left; 
        padding-left: 15px; 
        font-weight: 600; 
        font-size: 14px;
        position: sticky; 
        left: 0; 
        background: white; 
        z-index: 5;
        border-right: 2px solid var(--border);
        min-width: 180px;
    }

    input[type="number"], input[type="text"], select { 
        font-family: sylfaen;
        border: 1px solid #ddd; 
        border-radius: 6px; 
        outline: none;
    }

    input[type="number"] { 
        width: 40px; 
        height: 32px; 
        text-align: center; 
        font-weight: bold; 
        font-size: 16px;
        -moz-appearance: textfield;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .btn-ui { 
        padding: 8px 15px; 
        border-radius: 8px; 
        font-size: 12px; 
        font-weight: bold; 
        cursor: pointer; 
        text-decoration: none; 
        display: inline-block;
        transition: 0.3s;
    }

    .save-btn-top { 
        background: var(--success); 
        color: white; 
        border: none; 
        box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
    }

    .save-btn-top:active { transform: scale(0.95); }

    .logout-btn { 
        color: #e74c3c; 
        border: 1px solid #e74c3c; 
        background: white; 
    }

    #loading-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.8);
        z-index: 10;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: var(--primary);
    }

    /* 🗔 ԱՌԱՆՁԻՆ ՊԱՏՈՒՀԱՆԻ (MODAL) ՍԹԱՅԼԵՐ */
    .modal {
        display: none; 
        position: fixed; 
        z-index: 100; 
        left: 0; top: 0; width: 100%; height: 100%; 
        overflow: auto; 
        background-color: rgba(0,0,0,0.5); 
    }
    .modal-content {
        background-color: #fefefe;
        margin: 5% auto; 
        padding: 20px;
        border: 1px solid #888;
        width: 80%; 
        max-width: 850px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .close-btn {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close-btn:hover { color: black; }
    
    .admin-sections {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 15px;
    }
    .admin-box {
        flex: 1;
        min-width: 250px;
        background: #f9fbfd;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid var(--border);
    }
    .admin-box input[type="text"], .admin-box select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    .admin-box button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
    }
    .admin-box button:hover { opacity: 0.9; }
    .log-info {
        font-size: 11px;
        margin-top: 8px;
        color: #555;
        background: #eef5fc;
        padding: 6px;
        border-radius: 4px;
    }

    /* Ադմինի աղյուսակի սթայլեր */
    .admin-table-wrapper {
        margin-top: 20px;
        max-height: 250px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
    }
    .admin-table {
        width: 100%;
        border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
        padding: 8px;
        border: 1px solid var(--border);
        font-size: 12px;
        text-align: left;
    }
    .admin-table th { background: #f1f1f1; color: #555; position: sticky; top: 0; }

    @media print {
        .selector-box, .action-buttons, .logout-btn, #loading-overlay, .modal {
            display: none !important;
        }
        body { background-color: white; padding: 0; }
        .container { box-shadow: none; padding: 0; }
        .table-wrapper { overflow: visible !important; border: none; }
        table { min-width: 100% !important; border: 1px solid black; }
        th, td { border: 1px solid black !important; }
        .student-name { position: static !important; border-right: 1px solid black !important; }
        input { border: none !important; background: transparent !important; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>Ուսուցչի Մատյան</h2>
        <div class="action-buttons">
            <!-- Ավելացվեց Կառավարման կոճակը Տպել կոճակի կողքին -->
            <button class="btn-ui" style="background: #9b59b6; color: white; border: none;" onclick="openAdminModal()">ԿԱՌԱՎԱՐՈՒՄ</button>
            <button class="btn-ui" style="background: #34495e; color: white; border: none;" onclick="window.print()">ՏՊԵԼ</button>
            <button id="save-btn-ui" class="btn-ui save-btn-top" onclick="saveAll()">ՊԱՀՊԱՆԵԼ</button>
            <button onclick="logout()" class="btn-ui logout-btn">ԴՈՒՐՍ ԳԱԼ</button>
        </div>
    </div>

    <div class="selector-box">
        <div id="class-buttons-group" class="btn-group"></div>
        
        <div id="semester-section" class="btn-group" style="display:none;">
            <button class="btn sem-btn" onclick="selectType(1, this)">1-ին Կիսամյակ</button>
            <button class="btn sem-btn" onclick="selectType(2, this)">2-րդ Կիսամյակ</button>
            <button class="btn sem-btn" style="border-color:#9b59b6; color:#9b59b6;" onclick="selectType('annual', this)">ՏԱՐԵԿԱՆ</button>
        </div>
    </div>

    <div id="marks-table-container" style="display:none;">
        <div class="table-wrapper">
            <div id="loading-overlay">Բեռնվում է...</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th><th class="student-name">Աշակերտ</th>
                        <th>Հանրահաշիվ</th><th>Երկրաչափ.</th><th>Ֆիզիկա</th><th>Հայոց Լեզու</th><th>Գրական.</th>
                        <th>Պատմություն</th><th>Օտար Լեզու</th><th>Ռուսաց Լեզու</th><th>Ինֆորմատ.</th><th>Հասարակագ.</th>
                    </tr>
                </thead>
                <tbody id="students-list"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 🗔 ԿԱՌԱՎԱՐՄԱՆ ԱՌԱՆՁԻՆ ՊԱՏՈՒՀԱՆ (MODAL POP-UP) -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAdminModal()">&times;</span>
        <h3>🛠 Կառավարման Վահանակ</h3>
        <hr>
        
        <div class="admin-sections">
            <!-- Դասարան ավելացնել -->
            <div class="admin-box">
                <h4>➕ Ավելացնել Դասարան</h4>
                <input type="text" id="new-class-name" placeholder="Օրինակ՝ 10բ">
                <button onclick="addNewClass()">Ավելացնել</button>
            </div>

            <!-- Աշակերտ գրանցել -->
            <div class="admin-box">
                <h4>➕ Գրանցել Նոր Աշակերտ</h4>
                <input type="text" id="new-student-name" placeholder="Անուն">
                <input type="text" id="new-student-surname" placeholder="Ազգանուն">
                <select id="new-student-class">
                    <option value="">-- Ընտրել Դասարանը --</option>
                </select>
                <button onclick="addNewStudent()">Գրանցել</button>
                <div id="registration-log" class="log-info" style="display:none;"></div>
            </div>
        </div>

        <!-- 📋 ԳՐԱՆՑՎԱԾՆԵՐԻ ՑՈՒՑԱԿԸ ՊԱՏՈՒՀԱՆԻ ՄԵՋ -->
        <h4 style="margin-top: 25px; margin-bottom: 5px;">📋 Գրանցված Աշակերտների Ցուցակ (Լոգիններով)</h4>
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Անուն Ազգանուն</th>
                        <th>Դասարան</th>
                        <th>Լոգին (Username)</th>
                        <th>Գաղտնաբառ</th>
                    </tr>
                </thead>
                <tbody id="admin-students-table-body">
                    <!-- Տվյալները կգեներացվեն JS-ով -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Դուրս գալու ֆունկցիա
    function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxe-EM5zbd5ZbDoUAMApRjfGcpTiNSvfYMztYvg-ZaJeumX1JCj4ZPoONdil5iL_xs7/exec";
    
    let currentClass = '', currentView = '', allData = []; 
    const subjects = ["Հանրահաշիվ", "Երկրաչափություն", "Ֆիզիկա", "Հայոց Լեզու", "Հայ Գրականություն", "Հայոց Պատմություն", "Օտար Լեզու", "Ռուսաց Լեզու", "Ինֆորմատիկա", "Հասարակագիտություն"];
    
    // Հիմնական տվյալների օբյեկտը
    const studentsData = {
        '11ա': ['Աբգարյան Տաթևիկ', 'Աղեկյան Մանվել', 'Արամյան Արսեն', 'Արզումանյան Անժելա', 'Բաբայան Արյուսակ', 'Բաղդասարյան Արյուսակ', 'Բունիաթյան Գոհար', 'Գասպարյան Արսեն', 'Գյուլումյան Հասմիկ', 'Գրիգորյան Աննա', 'Զաքարյան Աշխեն', 'Խալաթյան Աշխեն', 'Կարապետյան Ալիսա', 'Հովհաննիսյան Մելինե', 'Մեսրոպյան Սոնա', 'Մուրադյան Արսեն', 'Ներսիսյան Մարինա', 'Նիկողոսյան Մարգարիտ', 'Շահբազյան Լիլիա', 'Սուքիսյան Նարինե'],
        '12ա': ['Աբելյան Զարուհի', 'Աբրահամյան Լիլիա', 'Գյուլումյան Վահե', 'Դավթյան Կարեն', 'Դիլանյան Աննա', 'Զալյան Արման', 'Թադևոսյան Սյուզան', 'Իգիթյան Սոնա', 'Լևոնյան Արթեմ', 'Կարապետյան Լիլիթ', 'Կիրակոսյան Ռոզա', 'Կիրակոսյան Ալիսա', 'Հակոբջանյան Անի', 'Մամիկոնյան Ռուբեն', 'Նահապետյան Գայանե', 'Սահակյան Կարեն', 'Վանյան Արյուսակ', 'Փայտյան Հրայր', 'Քյարունյան Կարեն', 'Օհաննիսյան Հակոբ']
    };

    // Պատուհանը բացելու ֆունկցիա
    function openAdminModal() {
        document.getElementById('adminModal').style.display = "block";
        renderAdminStudentsList(); // Թարմացնում ենք աղյուսակը բացվելիս
    }

    // Պատուհանը փակելու ֆունկցիա
    function closeAdminModal() {
        document.getElementById('adminModal').style.display = "none";
    }

    // Փակել պատուհանը, եթե սեղմում են պատուհանից դուրս տարածքի վրա
    window.onclick = function(event) {
        const modal = document.getElementById('adminModal');
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    // Ֆունկցիա՝ գեներացնում է լոգինը Անունից և Ազգանունից
    function generateUsername(fullName) {
        // Բաժանում ենք ազգանունն ու անունը իրարից (ենթադրում ենք «Ազգանուն Անուն» ֆորմատը)
        const parts = fullName.split(' ');
        const surname = parts[0] || 'User';
        const name = parts[1] || 'Student';
        // Վերադարձնում ենք Anun_Azganun ֆորմատով
        return `${name}_${surname}`;
    }

    // ՊԱՏՈՒՀԱՆԻ ՄԵՋԻ ԱՂՅՈՒՍԱԿԻ ԹԱՐՄԱՑՈՒՄԸ (Նախկին + Նոր աշակերտներ)
    function renderAdminStudentsList() {
        const tbody = document.getElementById('admin-students-table-body');
        tbody.innerHTML = '';

        Object.keys(studentsData).forEach(cls => {
            studentsData[cls].forEach(student => {
                const tr = document.createElement('tr');
                const username = generateUsername(student);

                tr.innerHTML = `
                    <td>${student}</td>
                    <td><strong style="color:var(--primary);">${cls}</strong></td>
                    <td><code>${username}</code></td>
                    <td><code>12345</code></td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // Ֆունկցիա՝ դասարանների կոճակները և ընտրացանկերը ԲՈԼՈՐ տեղերում թարմացնելու համար
    function updateClassUI() {
        const btnGroup = document.getElementById('class-buttons-group');
        const selectMenu = document.getElementById('new-student-class');
        const prevActive = currentClass;

        btnGroup.innerHTML = '';
        selectMenu.innerHTML = '<option value="">-- Ընտրել Դասարանը --</option>';

        Object.keys(studentsData).forEach(cls => {
            const btn = document.createElement('button');
            btn.className = `btn class-btn ${cls === prevActive ? 'active' : ''}`;
            btn.innerText = cls + " Դասարան";
            btn.onclick = function() { selectClass(cls, btn); };
            btnGroup.appendChild(btn);

            const option = document.createElement('option');
            option.value = cls;
            option.innerText = cls;
            selectMenu.appendChild(option);
        });
    }

    // ՆՈՐ ԴԱՍԱՐԱՆ ԱՎԵԼԱՑՆԵԼՈՒ ՖՈՒՆԿՑԻԱ
    function addNewClass() {
        const classInput = document.getElementById('new-class-name');
        const className = classInput.value.trim();

        if (!className) {
            alert("Խնդրում ենք գրել դասարանի անունը:");
            return;
        }
        if (studentsData[className]) {
            alert("Այս դասարանը արդեն գոյություն ունի:");
            return;
        }

        studentsData[className] = [];
        classInput.value = '';
        
        updateClassUI();
        renderAdminStudentsList(); // Թարմացնում ենք աղյուսակը պատուհանում
        alert(`${className} դասարանը հաջողությամբ ավելացվեց բոլոր տեղերում:`);
    }

    // ՆՈՐ ԱՇԱԿԵՐՏ ԳՐԱՆՑԵԼՈՒ ՖՈՒՆԿՑԻԱ
    function addNewStudent() {
        const nameInput = document.getElementById('new-student-name');
        const surnameInput = document.getElementById('new-student-surname');
        const classSelect = document.getElementById('new-student-class');

        const name = nameInput.value.trim();
        const surname = surnameInput.value.trim();
        const selectedClass = classSelect.value;

        if (!name || !surname || !selectedClass) {
            alert("Խնդրում ենք լրացնել բոլոր դաշտերը և ընտրել դասարանը:");
            return;
        }

        // Սարքում ենք ճիշտ ֆորմատի Անուն Ազգանունը (Ազգանուն Անուն տարբերակով)
        const fullName = `${surname.charAt(0).toUpperCase() + surname.slice(1)} ${name.charAt(0).toUpperCase() + name.slice(1)}`;

        if (studentsData[selectedClass].includes(fullName)) {
            alert("Այս աշակերտը արդեն գրանցված է այս դասարանում:");
            return;
        }

        studentsData[selectedClass].push(fullName);
        studentsData[selectedClass].sort(); // Այբբենական դասավորում

        const username = `${name.charAt(0).toUpperCase() + name.slice(1)}_${surname.charAt(0).toUpperCase() + surname.slice(1)}`;

        const logBox = document.getElementById('registration-log');
        logBox.style.display = 'block';
        logBox.innerHTML = `<strong>Գրանցվեց!</strong><br>Աշակերտ՝ ${fullName}<br>Լոգին՝ <code>${username}</code><br>Գաղտնաբառ՝ <code>12345</code>`;

        nameInput.value = '';
        surnameInput.value = '';
        classSelect.value = '';

        renderAdminStudentsList(); // Անմիջապես թարմացնում ենք ադմինի աղյուսակը

        if (currentClass === selectedClass && currentView !== '') {
            renderTable();
        }
    }

    async function refreshData() {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const response = await fetch(SCRIPT_URL);
            allData = await response.json();
        } catch (e) { console.error("Բեռնման սխալ:", e); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function selectClass(cls, btn) {
        currentClass = cls;
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('semester-section').style.display = 'flex';
        document.getElementById('marks-table-container').style.display = 'none';
    }

    async function selectType(type, btn) {
        currentView = type;
        document.querySelectorAll('.sem-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        await refreshData();
        renderTable();
    }

    function renderTable() {
        document.getElementById('marks-table-container').style.display = 'block';
        document.getElementById('save-btn-ui').style.display = (currentView === 'annual') ? 'none' : 'block';

        const list = document.getElementById('students-list');
        list.innerHTML = '';

        studentsData[currentClass].forEach((student, rIdx) => {
            let cells = '';
            subjects.forEach((sub, cIdx) => {
                const markRow = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === String(currentView));
                const val = markRow ? markRow[2] : "";

                if (currentView === 'annual') {
                    const m1Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "1");
                    const m2Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "2");
                    const m1 = m1Row ? parseFloat(m1Row[2]) : 0;
                    const m2 = m2Row ? parseFloat(m2Row[2]) : 0;
                    let annual = (m1 > 0 && m2 > 0) ? Math.round((m1 + m2) / 2) : "-";
                    cells += `<td><span style="font-weight:bold; color:#9b59b6;">${annual}</span></td>`;
                } else {
                    cells += `<td><input type="number" class="mark-input" data-student="${student}" data-subject="${sub}" 
                               data-original="${val}" value="${val}" min="1" max="10" oninput="validateMark(this)"></td>`;
                }
            });
            list.innerHTML += `<tr><td>${rIdx+1}</td><td class="student-name">${student}</td>${cells}</tr>`;
        });
    }

    function validateMark(input) {
        if(input.value !== "" && (parseInt(input.value) < 1 || parseInt(input.value) > 10)) {
            alert("1-10 սահմանում"); input.value = "";
        }
    }

    async function saveAll() {
        const inputs = document.querySelectorAll('.mark-input');
        const saveBtn = document.getElementById('save-btn-ui');
        saveBtn.innerText = "ՊԱՀՊԱՆՎՈՒՄ Է...";
        saveBtn.disabled = true;

        let promises = [];
        inputs.forEach(input => {
            const newVal = input.value;
            const oldVal = input.dataset.original;

            if (newVal !== oldVal) {
                const url = `${SCRIPT_URL}?name=${encodeURIComponent(input.dataset.student)}&subject=${encodeURIComponent(input.dataset.subject)}&grade=${encodeURIComponent(newVal)}&semester=${currentView}&class=${encodeURIComponent(currentClass)}`;
                promises.push(fetch(url, { method: 'POST' }));
            }
        });

        try {
            await Promise.all(promises);
            alert("Տվյալները սինխրոնացվեցին Sheets-ի հետ:");
            await refreshData();
            renderTable();
        } catch (e) { alert("Կապի սխալ:"); }
        
        saveBtn.innerText = "ՊԱՀՊԱՆԵԼ";
        saveBtn.disabled = false;
    }

    // Առաջին անգամ էջը միացնելիս ստեղծում ենք սկզբնական կոճակները
    updateClassUI();
</script>
</body>
</html>
