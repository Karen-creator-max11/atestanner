<!DOCTYPE html>
<html lang="hy">
<head>
    <script>
        // Ստուգում ենք մուտքը նախքան էջի բեռնվելը
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսուցչի Մատյան</title>
    <style>
        :root { 
            --primary: #4a90e2; 
            --bg: #f0f4f8; 
            --text: #2c3e50; 
            --success: #2ecc71; 
            --border: #dee2e6; 
            --annual-color: #9b59b6; 
        }

        body { 
            font-family: 'Sylfaen', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 10px; 
            color: var(--text); 
        }

        .container { 
            max-width: 100%; 
            margin: auto; 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
        }

        .header-section { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        h2 { font-size: 18px; color: var(--primary); margin: 0; }

        .print-header { display: none; }

        .selector-box { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 20px; 
        }

        .btn-group { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 8px; 
        }

        .btn { 
            padding: 8px 16px; 
            font-size: 13px; 
            cursor: pointer; 
            border: 2px solid var(--primary); 
            border-radius: 10px; 
            background: white; 
            color: var(--primary); 
            font-weight: bold; 
            transition: 0.2s;
        }

        .btn.active { background: var(--primary); color: white; }

        .table-wrapper { 
            overflow-x: auto; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            position: relative;
            -webkit-overflow-scrolling: touch; 
        }

        table { 
            width: 100%; 
            min-width: 900px; 
            border-collapse: collapse; 
            background: white;
        }

        th { 
            background: #f8f9fa; 
            padding: 12px 5px; 
            font-size: 10px; 
            border-bottom: 2px solid var(--border); 
            color: #7f8c8d;
            text-transform: uppercase;
        }

        td { 
            padding: 8px 5px; 
            border-bottom: 1px solid #f1f1f1; 
            text-align: center; 
        }

        .student-name { 
            text-align: left; 
            padding-left: 15px; 
            font-weight: 600; 
            font-size: 14px;
            position: sticky; 
            left: 0; 
            background: white; 
            z-index: 5;
            border-right: 2px solid var(--border);
            min-width: 180px;
        }

        input[type="number"] { 
            font-family: sylfaen;
            width: 40px; 
            height: 32px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 16px;
            outline: none;
            -moz-appearance: textfield;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-ui { 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block;
            transition: 0.3s;
        }

        .save-btn-top { 
            background: var(--success); 
            color: white; 
            border: none; 
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
        }

        .save-btn-top:disabled { background: #95a5a6; cursor: not-allowed; }

        .logout-btn { 
            color: #e74c3c; 
            border: 1px solid #e74c3c; 
            background: white; 
        }

        #loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            z-index: 10;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary);
        }

        @media print {
            @page { size: landscape; margin: 8mm; }
            .selector-box, .action-buttons, .logout-btn, #loading-overlay, .header-section h2 { display: none !important; }
            .print-header { display: block !important; text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: black; border-bottom: 2px solid #000; padding-bottom: 5px; }
            body { background: white !important; color: black !important; padding: 0; margin: 0; }
            .container { box-shadow: none !important; padding: 0 !important; background: transparent !important; }
            .table-wrapper { overflow: visible !important; border: none !important; }
            table { width: max-content !important; min-width: 100% !important; border-collapse: collapse !important; table-layout: auto !important; }
            th, td { border: 1px solid #000 !important; padding: 5px 3px !important; color: black !important; font-size: 11px !important; }
            th:first-child, td:first-child { width: 25px !important; max-width: 25px !important; text-align: center !important; }
            th:not(.student-name):not(:first-child) { writing-mode: vertical-rl !important; transform: rotate(180deg) !important; white-space: nowrap !important; vertical-align: middle !important; text-align: left !important; padding: 10px 4px !important; }
            th:not(.student-name):not(:first-child), td:not(.student-name):not(:first-child) { width: 32px !important; max-width: 32px !important; }
            thead tr { height: 120px !important; }
            th { background: #f0f0f0 !important; }
            .student-name { position: static !important; background: transparent !important; border-right: 1px solid #000 !important; font-size: 12px !important; width: 180px !important; min-width: 180px !important; }
            .mark-input { border: 1px solid #000 !important; background: white !important; display: inline-block !important; width: 26px !important; height: 22px !important; font-size: 13px !important; color: black !important; border-radius: 0px !important; text-align: center !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header" id="print-title">Ուսուցչի Մատյան</div>

    <div class="header-section">
        <h2>Ուսուցչի Մատյան</h2>
        <div class="action-buttons">
            <button class="btn-ui" style="background: #34495e; color: white; border: none;" onclick="window.print()">ՏՊԵԼ</button>
            <button id="save-btn-ui" class="btn-ui save-btn-top" onclick="saveAll()">ՊԱՀՊԱՆԵԼ</button>
            <button onclick="logout()" class="btn-ui logout-btn">ԴՈՒՐՍ ԳԱԼ</button>
        </div>
    </div>

    <div class="selector-box">
        <div class="btn-group">
            <button class="btn class-btn" onclick="selectClass('11ա', this)">11ա Դասարան</button>
            <button class="btn class-btn" onclick="selectClass('12ա', this)">12ա Դասարան</button>
            <button class="btn class-btn" onclick="selectClass('10դ', this)">10դ Դասարան</button>
        </div>
        <div id="semester-section" class="btn-group">
            <button class="btn sem-btn" onclick="selectType(1, this)">1-ին Կիսամյակ</button>
            <button class="btn sem-btn" onclick="selectType(2, this)">2-րդ Կիսամյակ</button>
            <button class="btn sem-btn" style="border-color:#9b59b6; color:#9b59b6;" onclick="selectType('annual', this)">ՏԱՐԵԿԱՆ</button>
        </div>
    </div>

    <div id="marks-table-container" style="display:none;">
        <div class="table-wrapper">
            <div id="loading-overlay">Բեռնվում է...</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th><th class="student-name">Աշակերտ</th>
                        <th>Հանրահաշիվ</th><th>Երկրաչափ.</th><th>Ֆիզիկա</th><th>Հայոց Լեզու</th><th>Գրական.</th>
                        <th>Պատմություն</th><th>Օտար Լեզու</th><th>Ռուսաց Լեզու</th><th>Ինֆորմատ.</th><th>Հասարակագ.</th><th>Մասնագ. մաթեմ.</th>
                    </tr>
                </thead>
                <tbody id="students-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyePREFn_ZczjKuuv2ElcVPz5Bj9uz7b9yMUGRiVTIf5QTGxNKB4EEh14kSZxCkkCND/exec";    
    let currentClass = '', currentView = '', allData = []; 
    
    const subjects = ["Հանրահաշիվ", "Երկրաչափություն", "Ֆիզիկա", "Հայոց Լեզու", "Հայ Գրականություն", "Հայոց Պատմություն", "Օտար Լեզու", "Ռուսաց Լեզու", "Ինֆորմատիկա", "Հասարակագիտություն", "Մասնագիտացված մաթեմատիկա"];
    const studentsData = {
        '11ա': ['Աբգարյան Տաթևիկ', 'Աղեկյան Մանվել', 'Արամյան Արսեն', 'Արզումանյան Անժելա', 'Բաբայան Արյուսակ', 'Բաղդասարյան Արյուսակ', 'Բունիաթյան Գոհար', 'Գասպարյան Արսեն', 'Գյուլումյան Հասմիկ', 'Գրիգորյան Աննա', 'Զաքարյան Աշխեն', 'Խալաթյան Աշխեն', 'Կարապետյան Ալիսա', 'Հովհաննիսյան Մելինե', 'Մեսրոպյան Սոնա', 'Մուրադյան Արսեն', 'Ներսիսյան Մարինա', 'Նիկողոսյան Մարգարիտ', 'Շահբազյան Լիլիա', 'Սուքիսյան Նարինե'],
        '12ա': ['Աբելյան Զարուհի', 'Աբրահամյան Լիլիա', 'Գյուլումյան Վահե', 'Դավթյան Կարեն', 'Դիլանյան Աննա', 'Զալյան Արման', 'Թադևոսյան Սյուզան', 'Իգիթյան Սոնա', 'Լևոնյան Արթեմ', 'Կարապետյան Լիլիթ', 'Կիրակոսյան Ռոզա', 'Կիրակոսյան Ալիսա', 'Հակոբջանյան Անի', 'Մամիկոնյան Ռուբեն', 'Նահապետյան Գայանե', 'Սահակյան Կարեն', 'Վանյան Արյուսակ', 'Փայտյան Հրայր', 'Քյարունյան Կարեն', 'Օհաննիսյան Հակոբ'],
        '10դ': ['Ասատրյան Հակոբ', 'Բաբաջանյան Դավիթ', 'Բարսեղյան Անահիտ', 'Գարսոյան Լիլիթ', 'Գոգյան Գարիկ', 'Մարաբյան Արսեն', 'Մինասյան Ալլա', 'Մինասյան Մինաս', 'Պոտրոսյան Գաբրիել', 'Քեշիշյան Մարի']
    };

    async function refreshData() {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const response = await fetch(SCRIPT_URL);
            allData = await response.json();
        } catch (e) { console.error("Բեռնման սխալ:", e); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function selectClass(cls, btn) {
        currentClass = cls;
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('semester-section').style.display = 'flex';
        document.getElementById('marks-table-container').style.display = 'none';
        updatePrintTitle();
    }

    async function selectType(type, btn) {
        currentView = type;
        document.querySelectorAll('.sem-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updatePrintTitle();
        await refreshData();
        renderTable();
    }

    function updatePrintTitle() {
        let viewText = "";
        if (currentView === 1) viewText = "1-ին Կիսամյակ";
        else if (currentView === 2) viewText = "2-րդ Կիսամյակ";
        else if (currentView === 'annual') viewText = "Տարեկան";

        document.getElementById('print-title').innerText = `Ուսուցչի Մատյան | Դասարան՝ ${currentClass} | ${viewText}`;
    }

    function renderTable() {
        document.getElementById('marks-table-container').style.display = 'block';
        document.getElementById('save-btn-ui').style.display = (currentView === 'annual') ? 'none' : 'block';

        const list = document.getElementById('students-list');
        list.innerHTML = '';

        studentsData[currentClass].forEach((student, rIdx) => {
            let cells = '';
            subjects.forEach((sub, cIdx) => {
                const markRow = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === String(currentView));
                const val = markRow ? markRow[2] : "";

                if (currentView === 'annual') {
                    const m1Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "1");
                    const m2Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "2");
                    const m1 = m1Row ? parseFloat(m1Row[2]) : 0;
                    const m2 = m2Row ? parseFloat(m2Row[2]) : 0;
                    let annual = (m1 > 0 && m2 > 0) ? Math.round((m1 + m2) / 2) : "-";
                    cells += `<td><span style="font-weight:bold; color:#9b59b6;">${annual}</span></td>`;
                } else {
                    // Ավելացվել են data-row և data-col ատրիբուտներ սլաքների նավիգացիայի համար
                    cells += `<td><input type="number" class="mark-input" data-row="${rIdx}" data-col="${cIdx}" data-student="${student}" data-subject="${sub}" 
                               data-original="${val}" value="${val}" min="1" max="10" oninput="validateMark(this)"></td>`;
                }
            });
            list.innerHTML += `<tr><td>${rIdx+1}</td><td class="student-name">${student}</td>${cells}</tr>`;
        });

        // ՆԱՎԻԳԱՑԻԱ ՍԼԱՔՆԵՐՈՎ
        setupArrowNavigation();
    }

    function setupArrowNavigation() {
        const list = document.getElementById('students-list');
        list.addEventListener('keydown', (e) => {
            if (!e.target.classList.contains('mark-input')) return;

            const currentRow = parseInt(e.target.dataset.row);
            const currentCol = parseInt(e.target.dataset.col);
            let targetRow = currentRow;
            let targetCol = currentCol;

            switch (e.key) {
                case 'ArrowUp':
                    targetRow--;
                    e.preventDefault(); // Էջի սքրոլը անջատելու համար
                    break;
                case 'ArrowDown':
                    targetRow++;
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    targetCol--;
                    break;
                case 'ArrowRight':
                    targetCol++;
                    break;
                default:
                    return; // Թողնել, որ մնացած կոճակները (թվերը) սովորական աշխատեն
            }

            // Եթե տողից դուրս է գալիս հորիզոնական, անցնում է հաջորդ/նախորդ աշակերտին
            if (targetCol < 0) {
                targetRow--;
                targetCol = subjects.length - 1;
            } else if (targetCol >= subjects.length) {
                targetRow++;
                targetCol = 0;
            }

            // Գտնում ենք թիրախային input-ը
            const nextInput = document.querySelector(`.mark-input[data-row="${targetRow}"][data-col="${targetCol}"]`);
            if (nextInput) {
                nextInput.focus();
                nextInput.select(); // Ավտոմատ նշում է թիվը, որ հեշտ լինի ջնջել/փոխել
            }
        });
    }

    function validateMark(input) {
        if(input.value !== "" && (parseInt(input.value) < 1 || parseInt(input.value) > 10)) {
            alert("1-10 սահմանում"); input.value = "";
        }
    }

    async function saveAll() {
        const inputs = document.querySelectorAll('.mark-input');
        const saveBtn = document.getElementById('save-btn-ui');
        
        let marksArray = [];

        inputs.forEach(input => {
            const newVal = input.value.trim();
            const oldVal = input.dataset.original.trim();

            if (newVal !== oldVal) {
                marksArray.push({
                    student: input.dataset.student,
                    subject: input.dataset.subject,
                    grade: newVal,
                    semester: currentView,
                    class: currentClass
                });
            }
        });

        if (marksArray.length === 0) {
            alert("Ոչ մի փոփոխություն չի կատարվել։");
            return;
        }

        saveBtn.innerText = "ՊԱՀՊԱՆՎՈՒՄ Է...";
        saveBtn.disabled = true;

        try {
            const params = new URLSearchParams();
            params.append('data', JSON.stringify({ marks: marksArray }));

            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            });

            alert("Գնահատականները հաջողությամբ պահպանվեցին։");
            
            setTimeout(async () => {
                await refreshData();
                renderTable();
                saveBtn.innerText = "ՊԱՀՊԱՆԵԼ";
                saveBtn.disabled = false;
            }, 1500);

        } catch (e) { 
            alert("Գնահատականները պահպանվեցին, թարմացրեք էջը։"); 
            saveBtn.innerText = "ՊԱՀՊԱՆԵԼ";
            saveBtn.disabled = false;
        }
    }
</script>
</body>
</html>
