<!DOCTYPE html>
<html lang="hy">
<head>
    <script>
        // Ստուգում ենք մուտքը նախքան էջի բեռնվելը
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսուցչի Մատյան - Սինխրոնացված</title>
    <style>
    :root { 
        --primary: #4a90e2; 
        --bg: #f0f4f8; 
        --text: #2c3e50; 
        --success: #2ecc71; 
        --border: #dee2e6; 
        --annual-color: #9b59b6; 
    }

    body { 
        font-family: 'Sylfaen', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: var(--bg); 
        margin: 0; 
        padding: 10px; 
        color: var(--text); 
    }

    .container { 
        max-width: 100%; 
        margin: auto; 
        background: white; 
        padding: 15px; 
        border-radius: 15px; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
    }

    .header-section { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; 
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }

    h2 { font-size: 18px; color: var(--primary); margin: 0; }

    .selector-box { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        gap: 12px; 
        margin-bottom: 20px; 
    }

    .btn-group { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 8px; 
    }

    .btn { 
        padding: 8px 16px; 
        font-size: 13px; 
        cursor: pointer; 
        border: 2px solid var(--primary); 
        border-radius: 10px; 
        background: white; 
        color: var(--primary); 
        font-weight: bold; 
        transition: 0.2s;
    }

    .btn.active { background: var(--primary); color: white; }

    .table-wrapper { 
        overflow-x: auto; 
        border-radius: 12px; 
        border: 1px solid var(--border); 
        position: relative;
        -webkit-overflow-scrolling: touch; 
    }

    table { 
        width: 100%; 
        min-width: 900px; 
        border-collapse: collapse; 
        background: white;
    }

    th { 
        background: #f8f9fa; 
        padding: 12px 5px; 
        font-size: 10px; 
        border-bottom: 2px solid var(--border); 
        color: #7f8c8d;
        text-transform: uppercase;
    }

    td { 
        padding: 8px 5px; 
        border-bottom: 1px solid #f1f1f1; 
        text-align: center; 
    }

    .student-name { 
        text-align: left; 
        padding-left: 15px; 
        font-weight: 600; 
        font-size: 14px;
        position: sticky; 
        left: 0; 
        background: white; 
        z-index: 5;
        border-right: 2px solid var(--border);
        min-width: 180px;
    }

    input[type="number"], .admin-input { 
        font-family: sylfaen;
        width: 40px; 
        height: 32px; 
        border: 1px solid #ddd; 
        border-radius: 6px; 
        text-align: center; 
        font-weight: bold; 
        font-size: 16px;
        outline: none;
    }

    .admin-input {
        width: 200px;
        text-align: left;
        padding: 0 10px;
        font-size: 14px;
    }

    select {
        font-family: sylfaen;
        height: 34px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid #ddd;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .btn-ui { 
        padding: 8px 15px; 
        border-radius: 8px; 
        font-size: 12px; 
        font-weight: bold; 
        cursor: pointer; 
        text-decoration: none; 
        display: inline-block;
        transition: 0.3s;
    }

    .save-btn-top { 
        background: var(--success); 
        color: white; 
        border: none; 
        box-shadow: 0 4px 10px rgba(46, 204, 113, 0.2);
    }

    .save-btn-top:active { transform: scale(0.95); }

    .logout-btn { 
        color: #e74c3c; 
        border: 1px solid #e74c3c; 
        background: white; 
    }

    #loading-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.8);
        z-index: 10;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: var(--primary);
    }

    /* Ադմին պանելի ոճեր */
    .admin-panel {
        display: none;
        background: #fdfdfd;
        border: 2px dashed var(--primary);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
    }
    .admin-section {
        margin-bottom: 15px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }
    .admin-table {
        min-width: 100% !important;
        margin-top: 15px;
    }
    .admin-table th {
        background: #eaeff5;
    }

    @media print {
        .selector-box, .action-buttons, .logout-btn, #loading-overlay, .admin-panel, #admin-toggle-btn {
            display: none !important;
        }
        body { background-color: white; padding: 0; }
        .container { box-shadow: none; padding: 0; }
        .table-wrapper { overflow: visible !important; border: none; }
        table { min-width: 100% !important; border: 1px solid black; }
        th, td { border: 1px solid black !important; }
        .student-name { position: static !important; border-right: 1px solid black !important; }
        input { border: none !important; background: transparent !important; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>Ուսուցչի Մատյան</h2>
        <div class="action-buttons">
            <button id="admin-toggle-btn" class="btn-ui" style="background: #e67e22; color: white; border: none;" onclick="toggleAdminPanel()">ԿԱՌԱՎԱՐՈՒՄ</button>
            <button class="btn-ui" style="background: #34495e; color: white; border: none;" onclick="window.print()">ՏՊԵԼ</button>
            <button id="save-btn-ui" class="btn-ui save-btn-top" onclick="saveAll()">ՊԱՀՊԱՆԵԼ</button>
            <button onclick="logout()" class="btn-ui logout-btn">ԴՈՒՐՍ ԳԱԼ</button>
        </div>
    </div>

    <!-- Կառավարման Վահանակ -->
    <div id="admin-panel" class="admin-panel">
        <h3>Կառավարման Վահանակ</h3>
        <hr>
        <div class="admin-section">
            <h4>Ավելացնել Դասարան:</h4>
            <input type="text" id="new-class-name" class="admin-input" placeholder="Օրինակ՝ 10բ">
            <button class="btn" onclick="addNewClass()">Ավելացնել Դասարան</button>
        </div>
        <div class="admin-section">
            <h4>Ավելացնել Աշակերտ:</h4>
            <input type="text" id="new-student-name" class="admin-input" placeholder="Ազգանուն Անուն">
            <select id="student-class-select"></select>
            <button class="btn" onclick="addNewStudent()">Ավելացնել Աշակերտ</button>
        </div>
        <hr>
        <h4>Բոլոր Գրանցված Աշակերտները</h4>
        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Աշակերտ</th>
                        <th>Դասարան</th>
                        <th>Լոգին</th>
                        <th>Գաղտնաբառ</th>
                    </tr>
                </thead>
                <tbody id="admin-students-list"></tbody>
            </table>
        </div>
    </div>

    <div class="selector-box">
        <div id="class-buttons-group" class="btn-group">
            <!-- Դասարանների կոճակները կգեներացվեն ավտոմատ -->
        </div>
        <div id="semester-section" class="btn-group" style="display:none;">
            <button class="btn sem-btn" onclick="selectType(1, this)">1-ին Կիսամյակ</button>
            <button class="btn sem-btn" onclick="selectType(2, this)">2-րդ Կիսամյակ</button>
            <button class="btn sem-btn" style="border-color:#9b59b6; color:#9b59b6;" onclick="selectType('annual', this)">ՏԱՐԵԿԱՆ</button>
        </div>
    </div>

    <div id="marks-table-container" style="display:none;">
        <div class="table-wrapper">
            <div id="loading-overlay">Բեռնվում է...</div>
            <table>
                <thead>
                    <tr>
                        <th>#</th><th class="student-name">Աշակերտ</th>
                        <th>Հանրահաշիվ</th><th>Երկրաչափ.</th><th>Ֆիզիկա</th><th>Հայոց Լեզու</th><th>Գրական.</th>
                        <th>Պատմություն</th><th>Օտար Լեզու</th><th>Ռուսաց Լեզու</th><th>Ինֆորմատ.</th><th>Հասարակագ.</th>
                    </tr>
                </thead>
                <tbody id="students-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Դուրս գալու ֆունկցիա
    function logout() {
        localStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxe-EM5zbd5ZbDoUAMApRjfGcpTiNSvfYMztYvg-ZaJeumX1JCj4ZPoONdil5iL_xs7/exec";
    
    let currentClass = '', currentView = '', allData = []; 
    const subjects = ["Հանրահաշիվ", "Երկրաչափություն", "Ֆիզիկա", "Հայոց Լեզու", "Հայ Գրականություն", "Հայոց Պատմություն", "Օտար Լեզու", "Ռուսաց Լեզու", "Ինֆորմատիկա", "Հասարակագիտություն"];
    
    // Սկզբնական տվյալներ, եթե localStorage-ում դեռ ոչինչ չկա
    const defaultClasses = ['11ա', '12ա'];
    const defaultStudents = {
        '11ա': ['Աբգարյան Տաթևիկ', 'Աղեկյան Մանվել', 'Արամյան Արսեն', 'Արզումանյան Անժելա', 'Բաբայան Արյուսակ', 'Բաղդասարյան Արյուսակ', 'Բունիաթյան Գոհար', 'Գասպարյան Արսեն', 'Գյուլումյան Հասմիկ', 'Գրիգորյան Աննա', 'Զաքարյան Աշխեն', 'Խալաթյան Աշխեն', 'Կարապետյան Ալիսա', 'Հովհաննիսյան Մելինե', 'Մեսրոպյան Սոնա', 'Մուրադյան Արսեն', 'Ներսիսյան Մարինա', 'Նիկողոսյան Մարգարիտ', 'Շահբազյան Լիլիա', 'Սուքիսյան Նարինե'],
        '12ա': ['Աբելյան Զարուհի', 'Աբրահամյան Լիլիա', 'Գյուլումյան Վահե', 'Դավթյան Կարեն', 'Դիլանյան Աննա', 'Զալյան Արման', 'Թադևոսյան Սյուզան', 'Իգիթյան Սոնա', 'Լևոնյան Արթեմ', 'Կարապետյան Լիլիթ', 'Կիրակոսյան Ռոզա', 'Կիրակոսյան Ալիսա', 'Հակոբջանյան Անի', 'Մամիկոնյան Ռուբեն', 'Նահապետյան Գայանե', 'Սահակյան Կարեն', 'Վանյան Արյուսակ', 'Փայտյան Հրայր', 'Քյարունյան Կարեն', 'Օհաննիսյան Հակոբ']
    };

    // Բեռնում ենք տվյալները LocalStorage-ից կամ սահմանում ենք լռելյայն արժեքները
    let classesList = JSON.parse(localStorage.getItem("classesList")) || defaultClasses;
    let studentsData = JSON.parse(localStorage.getItem("studentsData")) || defaultStudents;

    // Պահպանում ենք աշակերտների մուտքային տվյալները (Login/Password) հեշտ հասանելիության համար
    function updateStudentLogins() {
        let studentUsers = {};
        classesList.forEach(cls => {
            if (studentsData[cls]) {
                studentsData[cls].forEach(student => {
                    let login = student.trim().replace(/\s+/g, '_');
                    studentUsers[login] = {
                        name: student,
                        class: cls,
                        password: "12345"
                    };
                });
            }
        });
        localStorage.setItem("studentUsers", JSON.stringify(studentUsers));
    }

    function initUI() {
        // Գեներացնում ենք դասարանների կոճակները
        const btnGroup = document.getElementById('class-buttons-group');
        btnGroup.innerHTML = '';
        classesList.forEach(cls => {
            btnGroup.innerHTML += `<button class="btn class-btn" onclick="selectClass('${cls}', this)">${cls} Դասարան</button>`;
        });

        // Գեներացնում ենք սելեկտը ադմինում
        const select = document.getElementById('student-class-select');
        select.innerHTML = '';
        classesList.forEach(cls => {
            select.innerHTML += `<option value="${cls}">${cls}</option>`;
        });

        updateStudentLogins();
        renderAdminStudents();
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    function addNewClass() {
        const classNameInput = document.getElementById('new-class-name');
        const className = classNameInput.value.trim();
        if (className === '') return alert('Մուտքագրեք դասարանի անունը');
        if (classesList.includes(className)) return alert('Այս դասարանը արդեն գոյություն ունի');

        classesList.push(className);
        studentsData[className] = [];
        
        localStorage.setItem("classesList", JSON.stringify(classesList));
        localStorage.setItem("studentsData", JSON.stringify(studentsData));
        
        classNameInput.value = '';
        initUI();
        alert('Դասարանը ավելացվեց');
    }

    function addNewStudent() {
        const studentNameInput = document.getElementById('new-student-name');
        const studentName = studentNameInput.value.trim();
        const selectedClass = document.getElementById('student-class-select').value;

        if (studentName === '') return alert('Մուտքագրեք աշակերտի Անուն Ազգանունը');
        if (!selectedClass) return alert('Նախ ընտրեք կամ ստեղծեք դասարան');

        if (!studentsData[selectedClass]) {
            studentsData[selectedClass] = [];
        }
        studentsData[selectedClass].push(studentName);

        localStorage.setItem("studentsData", JSON.stringify(studentsData));
        
        studentNameInput.value = '';
        updateStudentLogins();
        renderAdminStudents();
        if(currentClass === selectedClass && currentView !== '') {
            renderTable();
        }
        alert('Աշակերտը ավելացվեց');
    }

    function renderAdminStudents() {
        const tbody = document.getElementById('admin-students-list');
        tbody.innerHTML = '';
        classesList.forEach(cls => {
            if (studentsData[cls]) {
                studentsData[cls].forEach(student => {
                    let login = student.trim().replace(/\s+/g, '_');
                    tbody.innerHTML += `<tr>
                        <td style="text-align:left; padding-left:15px; font-weight:600;">${student}</td>
                        <td>${cls}</td>
                        <td><code style="background:#eee; padding:2px 5px; border-radius:4px;">${login}</code></td>
                        <td><code>12345</code></td>
                    </tr>`;
                });
            }
        });
    }

    async function refreshData() {
        document.getElementById('loading-overlay').style.display = 'flex';
        try {
            const response = await fetch(SCRIPT_URL);
            allData = await response.json();
        } catch (e) { console.error("Բեռնման սխալ:", e); }
        document.getElementById('loading-overlay').style.display = 'none';
    }

    function selectClass(cls, btn) {
        currentClass = cls;
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('semester-section').style.display = 'flex';
        document.getElementById('marks-table-container').style.display = 'none';
    }

    async function selectType(type, btn) {
        currentView = type;
        document.querySelectorAll('.sem-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        await refreshData();
        renderTable();
    }

    function renderTable() {
        document.getElementById('marks-table-container').style.display = 'block';
        document.getElementById('save-btn-ui').style.display = (currentView === 'annual') ? 'none' : 'block';

        const list = document.getElementById('students-list');
        list.innerHTML = '';

        if (!studentsData[currentClass] || studentsData[currentClass].length === 0) {
            list.innerHTML = '<tr><td colspan="12">Այս դասարանում աշակերտներ չկան</td></tr>';
            return;
        }

        studentsData[currentClass].forEach((student, rIdx) => {
            let cells = '';
            subjects.forEach((sub, cIdx) => {
                const markRow = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === String(currentView));
                const val = markRow ? markRow[2] : "";

                if (currentView === 'annual') {
                    const m1Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "1");
                    const m2Row = allData.find(r => r[0] === student && r[1] === sub && String(r[3]) === "2");
                    const m1 = m1Row ? parseFloat(m1Row[2]) : 0;
                    const m2 = m2Row ? parseFloat(m2Row[2]) : 0;
                    let annual = (m1 > 0 && m2 > 0) ? Math.round((m1 + m2) / 2) : "-";
                    cells += `<td><span style="font-weight:bold; color:#9b59b6;">${annual}</span></td>`;
                } else {
                    cells += `<td><input type="number" class="mark-input" data-student="${student}" data-subject="${sub}" 
                               data-original="${val}" value="${val}" min="1" max="10" oninput="validateMark(this)"></td>`;
                }
            });
            list.innerHTML += `<tr><td>${rIdx+1}</td><td class="student-name">${student}</td>${cells}</tr>`;
        });
    }

    function validateMark(input) {
        if(input.value !== "" && (parseInt(input.value) < 1 || parseInt(input.value) > 10)) {
            alert("1-10 սահմանում"); input.value = "";
        }
    }

    async function saveAll() {
        const inputs = document.querySelectorAll('.mark-input');
        const saveBtn = document.getElementById('save-btn-ui');
        saveBtn.innerText = "ՊԱՀՊԱՆՎՈՒՄ Է...";
        saveBtn.disabled = true;

        let promises = [];
        inputs.forEach(input => {
            const newVal = input.value;
            const oldVal = input.dataset.original;

            if (newVal !== oldVal) {
                const url = `${SCRIPT_URL}?name=${encodeURIComponent(input.dataset.student)}&subject=${encodeURIComponent(input.dataset.subject)}&grade=${encodeURIComponent(newVal)}&semester=${currentView}&class=${encodeURIComponent(currentClass)}`;
                promises.push(fetch(url, { method: 'POST' }));
            }
        });

        try {
            await Promise.all(promises);
            alert("Տվյալները սինխրոնացվեցին Sheets-ի հետ:");
            await refreshData();
            renderTable();
        } catch (e) { alert("Կապի սխալ:"); }
        
        saveBtn.innerText = "ՊԱՀՊԱՆԵԼ";
        saveBtn.disabled = false;
    }

    // Ինիցիալիզացիա բեռնելիս
    initUI();
</script>
</body>
</html>
